<header class="fixed top-0 left-0 right-0 bg-black text-white z-20 transition-all duration-200">

  <div class="relative px-3 sm:px-4 md:px-6 py-3 md:py-4 flex items-center justify-between border-b border-white/10">

    <!-- Logo -->
    <div class="h-8 sm:h-10 md:h-14 lg:h-16 flex items-center overflow-hidden shrink-0 transition-all duration-300">
      <img
        src="/MBA_claim_blanco.png"
        width="200"
        height="64"
        alt="Mercedes-Benz - The standard for buses"
        class="h-full w-auto object-contain scale-100 sm:scale-105 md:scale-110 transition-transform duration-300">
    </div>

    <!-- Título centrado (solo desktop grande, para no chocar con logo/avatar) -->
    <span class="hidden lg:block absolute left-1/2 -translate-x-1/2 text-lg xl:text-2xl font-serif tracking-wide text-white truncate max-w-[300px]">
      Daimler Buses México
    </span>

    <!-- Avatar / Menú de Usuario -->
    <div class="relative shrink-0">
      <button
        id="avatarButton"
        type="button"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="isUserMenuOpen()"
        aria-haspopup="true"
        class="w-10 h-10 rounded-full overflow-hidden border border-white/20 hover:border-white/40 transition-colors focus:outline-none focus:ring-2 focus:ring-white/50">
        <img
          [src]="avatarUrl()"
          width="40"
          height="40"
          class="w-full h-full object-cover"
          [alt]="'Menú de ' + userName()">
      </button>

      <!-- Dropdown menu -->
      <div id="userDropdown"
           role="menu"
           aria-labelledby="avatarButton"
           (keydown.escape)="toggleUserMenu()"
           [class.hidden]="!isUserMenuOpen()"
           class="fixed inset-0 md:absolute md:inset-auto md:right-0 md:top-full md:mt-2 z-50 bg-white border-t md:border border-gray-200 md:rounded-xl shadow-2xl w-full md:w-72 h-full md:h-auto text-black overflow-y-auto duration-200">

        <!-- Header (Mobile Close Button) -->
        <div class="md:hidden px-6 py-4 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-10">
          <span class="text-xl font-medium text-gray-800">Menú</span>
          <button type="button" (click)="toggleUserMenu()" class="p-2 -mr-2 text-gray-400 hover:text-gray-600 rounded-full transition-colors" aria-label="Cerrar menú">
            <svg aria-hidden="true" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <div class="p-6 space-y-8 md:space-y-6">
          <!-- USER Section -->
          <div class="flex justify-between items-center md:items-start">
            <div class="space-y-1 min-w-0">
              <span class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest">Usuario</span>
              <span class="block text-base md:text-sm font-medium text-gray-700 truncate">{{ userApellido() }}, {{ userName() }}</span>
              <span class="block text-xs text-gray-400 truncate">{{ auth.currentUser()?.email ?? auth.currentUser()?.sCorreo ?? '' }}</span>
            </div>
          </div>

          <!-- Actions Section -->
          <div class="pt-6 md:pt-4 border-t border-gray-100">
            <ul role="none" class="space-y-1 md:space-y-2">
              <li role="none">
                <button
                  type="button"
                  role="menuitem"
                  (click)="openLogoutModal()"
                  class="flex items-center gap-4 md:gap-3 p-3 md:p-2 -mx-3 md:mx-0 text-red-500 hover:bg-red-50 md:hover:bg-transparent md:hover:text-red-700 font-medium rounded-xl md:rounded-none transition-all w-full text-left"
                >
                  <div class="w-10 h-10 md:w-5 md:h-5 flex items-center justify-center bg-red-50 md:bg-transparent rounded-lg md:rounded-none">
                    <svg aria-hidden="true" class="w-6 h-6 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                  </div>
                  <span class="text-base md:text-sm">Cerrar Sesión</span>
                </button>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </div>

  </div>
</header>

<!-- Toast de Notificaciones -->
<div class="fixed top-4 right-4 z-50" [class.hidden]="!isToastVisible()" role="status" aria-live="polite">
  <div class="inline-flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border bg-white"
       [class.border-emerald-200]="toastType() === 'success'"
       [class.text-emerald-700]="toastType() === 'success'"
       [class.border-red-200]="toastType() === 'error'"
       [class.text-red-700]="toastType() === 'error'"
       [class.border-gray-200]="toastType() === 'info'"
       [class.text-gray-800]="toastType() === 'info'">

    @if (toastType() === 'success') {
      <svg aria-hidden="true" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    } @else if (toastType() === 'error') {
      <svg aria-hidden="true" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    } @else {
      <svg aria-hidden="true" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-width="2" d="M12 13V8m0 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
      </svg>
    }

    <span class="text-sm">{{ toastMessage() }}</span>
    <button type="button" (click)="closeToast()" class="ml-2 text-gray-400 hover:text-gray-600" aria-label="Cerrar notificación">
      <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>

<!-- Modal de Confirmación de Logout -->
<div id="popup-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="logout-modal-title"
     tabindex="-1"
     (keydown.escape)="closeLogoutModal()"
     [class.hidden]="!isLogoutModalOpen()"
     [class.flex]="isLogoutModalOpen()"
     class="overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-[60] justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full bg-black/50 backdrop-blur-sm">
  <div class="relative p-4 w-full max-w-md max-h-full">
    <div class="relative bg-white border border-gray-100 rounded-2xl shadow-lg p-4 md:p-6">
      <button type="button" (click)="closeLogoutModal()" aria-label="Cerrar"
        class="absolute top-3 end-2.5 text-gray-400 bg-transparent hover:bg-gray-100 hover:text-gray-600 rounded-lg text-sm w-9 h-9 ms-auto inline-flex justify-center items-center transition-colors">
        <svg aria-hidden="true" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
        </svg>
        <span class="sr-only">Cerrar modal</span>
      </button>
      <div class="p-4 md:p-5 text-center">
        <svg aria-hidden="true" class="mx-auto mb-4 text-gray-300 w-12 h-12" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 13V8m0 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <h3 id="logout-modal-title" class="mb-6 text-gray-700">¿Estás seguro que deseas cerrar sesión?</h3>
        <div class="flex items-center space-x-4 justify-center">
          <button (click)="logout()" type="button"
            class="text-white bg-red-500 border border-transparent hover:bg-red-600 focus:ring-4 focus:ring-red-200 shadow-sm font-medium rounded-xl text-sm px-4 py-2.5 focus:outline-none transition-colors">
            Sí, cerrar sesión
          </button>
          <button (click)="closeLogoutModal()" type="button"
            class="text-gray-600 bg-gray-100 border border-gray-200 hover:bg-gray-200 hover:text-gray-800 focus:ring-4 focus:ring-gray-200 shadow-sm font-medium rounded-xl text-sm px-4 py-2.5 focus:outline-none transition-colors">
            No, cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
